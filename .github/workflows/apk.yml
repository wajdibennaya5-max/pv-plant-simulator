# CONSTRUIT L'APK ANDROID.
#
# Le SDK Android est déjà installé sur les machines « ubuntu-latest » de
# GitHub : il n'y a donc rien à télécharger, et la chaîne fonctionne sans
# configuration. Le projet Gradle recopie lui-même l'application web dans les
# assets, de sorte qu'il n'existe qu'une seule source de vérité.
name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    # LA CLÉ EST LUE AU NIVEAU DU JOB, ET C'EST OBLIGATOIRE.
    #
    # Le contexte `secrets` n'existe pas dans un `if` d'étape, et une variable
    # posée dans le `env` d'une étape n'est pas encore lisible par le `if` de
    # cette même étape. Sans ce détour, les étapes de signature paraissent
    # correctes et ne s'exécutent jamais.
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Les tests d'abord
        # Un APK construit sur du code qui ne passe pas ses tests coûte plus
        # cher qu'un APK manquant : on le découvre sur le téléphone.
        run: npm test

      - uses: gradle/actions/setup-gradle@v4

      - name: APK de développement
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: centrale-pv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── Publication signée, seulement si une clé est configurée ──────────
      # Sans le secret, ces étapes sont sautées et l'APK de développement
      # reste disponible ci-dessus. Voir docs/apk.md.
      - name: Déchiffrer la clé de signature
        if: env.KEYSTORE != ''
        run: echo "$KEYSTORE" | base64 -d > "${{ runner.temp }}/cle.jks"

      - name: APK signé
        if: env.KEYSTORE != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cle.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE != ''
        with:
          name: centrale-pv-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attacher l'APK à la version publiée
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
