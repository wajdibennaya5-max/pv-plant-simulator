# Les tests tournent sans navigateur et sans dépendance : c'est ce que
# l'architecture achète, et c'est pourquoi cette chaîne tient en dix lignes.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
