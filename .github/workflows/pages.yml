# PUBLIE L'APPLICATION WEB SUR GITHUB PAGES.
#
# Rien à construire : le dépôt EST le site. On écarte seulement ce qui n'a
# rien à faire chez le visiteur — les tests et le projet Android.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier avant de publier
        run: npm test

      - name: Rassembler le site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r js icons _site/

      # `enablement` active Pages tout seul au premier passage. Sans lui, la
      # chaîne échoue sur « Get Pages site failed » tant que personne n'est
      # allé cocher la case dans les réglages — un échec qui n'apprend rien
      # et qu'on ne comprend qu'en lisant le journal.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
