# PUBLIE L'APPLICATION WEB SUR GITHUB PAGES.
#
# Rien à construire : le dépôt EST le site. On écarte seulement ce qui n'a
# rien à faire chez le visiteur — les tests et le projet Android.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier avant de publier
        run: npm test

      - name: Rassembler le site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r js icons _site/

      # GITHUB PAGES DOIT ÊTRE ACTIVÉ UNE FOIS, À LA MAIN.
      #
      # `enablement: true` a été essayé et ne marche pas : le jeton de la
      # chaîne sait DÉPLOYER sur Pages, mais pas CRÉER le site. L'appel
      # échoue sur « Create Pages site failed: Resource not accessible by
      # integration », et il faudrait un jeton personnel pour passer outre —
      # un secret de plus à gérer pour une case à cocher une seule fois.
      #
      #     Settings → Pages → Build and deployment → Source: GitHub Actions
      #
      # Tant que ce n'est pas fait, cette chaîne échoue sur « Get Pages site
      # failed » et rien n'est publié ; l'APK et les tests, eux, ne sont pas
      # concernés.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
